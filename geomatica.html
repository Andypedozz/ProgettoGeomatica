<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geomatica — Tracciamento Itinerari</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
/* ─── TOKENS ─────────────────────────────────────────────── */
:root {
  --bg:        #0e1117;
  --surface:   #161b26;
  --panel:     #1e2535;
  --border:    #2a3347;
  --accent:    #3d7fff;
  --accent2:   #00c9a7;
  --danger:    #e05c5c;
  --text:      #dce3f0;
  --muted:     #7a8aaa;
  --font-ui:   'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Mono', monospace;
  --radius:    6px;
  --panel-w:   340px;
}

/* ─── RESET ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 13px; }

/* ─── LAYOUT ──────────────────────────────────────────────── */
#app { display: flex; height: 100vh; width: 100vw; }

#sidebar {
  width: var(--panel-w);
  min-width: var(--panel-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 1000;
}

#map-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#map { width: 100%; height: 100%; }

/* ─── SIDEBAR HEADER ──────────────────────────────────────── */
#sidebar-header {
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

.logo {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--text);
}
.logo span { color: var(--accent); }

.tagline {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;
  font-family: var(--font-mono);
}

/* ─── SECTIONS ────────────────────────────────────────────── */
.section {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

/* ─── TRANSPORT ───────────────────────────────────────────── */
.transport-row {
  display: flex;
  gap: 8px;
}

.t-btn {
  flex: 1;
  padding: 8px 0;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-ui);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all .15s;
}
.t-btn:hover { border-color: var(--accent); color: var(--text); }
.t-btn.active { border-color: var(--accent); background: rgba(61,127,255,.15); color: var(--accent); }

/* ─── ADDRESS INPUT ───────────────────────────────────────── */
.input-row {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
}

input[type="text"] {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 7px 10px;
  font-size: 12px;
  font-family: var(--font-ui);
  outline: none;
  transition: border-color .15s;
}
input[type="text"]:focus { border-color: var(--accent); }
input[type="text"]::placeholder { color: var(--muted); }

.btn {
  padding: 7px 12px;
  border-radius: var(--radius);
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font-ui);
  font-weight: 600;
  transition: all .15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #5590ff; }
.btn-secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-danger { background: transparent; color: var(--danger); border: 1px solid transparent; padding: 4px 7px; font-size: 11px; }
.btn-danger:hover { border-color: var(--danger); }
.btn-accent2 { background: var(--accent2); color: #0e1117; }
.btn-accent2:hover { background: #00e5bf; }

/* ─── WAYPOINTS LIST ──────────────────────────────────────── */
#waypoints-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.waypoint-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 6px;
  background: var(--panel);
  cursor: pointer;
  transition: border-color .15s;
}
.waypoint-item:hover { border-color: var(--accent); }
.waypoint-item.start { border-left: 3px solid var(--accent2); }
.waypoint-item.end   { border-left: 3px solid var(--accent); }

.wp-index {
  min-width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
}
.wp-index.start-dot { background: var(--accent2); color: #0e1117; }
.wp-index.end-dot   { background: var(--accent); }

.wp-label {
  flex: 1;
  font-size: 11px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wp-coords {
  font-size: 10px;
  color: var(--muted);
  font-family: var(--font-mono);
}

/* ─── START/END SELECTS ───────────────────────────────────── */
.select-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 0;
}

select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 7px 8px;
  font-size: 11px;
  font-family: var(--font-ui);
  outline: none;
  cursor: pointer;
  width: 100%;
}
select:focus { border-color: var(--accent); }

.select-label {
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 4px;
}

/* ─── STATS BAR ───────────────────────────────────────────── */
#stats-bar {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  background: var(--panel);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.stat-val {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  font-family: var(--font-mono);
}
.stat-val.accent { color: var(--accent); }
.stat-val.accent2 { color: var(--accent2); }
.stat-lbl {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .8px;
}

/* ─── ELEVATION PANEL ─────────────────────────────────────── */
#elevation-panel {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 170px;
  background: rgba(14,17,23,.93);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--border);
  padding: 8px 16px 12px;
  z-index: 500;
  display: none;
}

#elevation-panel.visible { display: block; }

.elev-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.elev-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

#close-elev {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 0 4px;
}
#close-elev:hover { color: var(--text); }

#elev-chart-wrap { height: 120px; }

/* ─── MAP TOAST ────────────────────────────────────────────── */
#map-toast {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 18px;
  font-size: 12px;
  color: var(--muted);
  pointer-events: none;
  z-index: 600;
  transition: opacity .3s;
}

/* ─── LOADING OVERLAY ─────────────────────────────────────── */
#loading {
  position: absolute;
  inset: 0;
  background: rgba(14,17,23,.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  backdrop-filter: blur(2px);
  display: none;
}
#loading.visible { display: flex; }

.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── OFFLINE BADGE ───────────────────────────────────────── */
#offline-badge {
  position: absolute;
  top: 16px; right: 16px;
  background: #b45309;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 12px;
  letter-spacing: .8px;
  z-index: 700;
  display: none;
}

/* ─── LEAFLET CUSTOM MARKERS ──────────────────────────────── */
.lf-marker {
  width: 28px; height: 28px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
}
.lf-marker-inner {
  transform: rotate(45deg);
  font-size: 10px; font-weight: 700;
  color: #fff;
}

/* ─── SCROLLBAR ───────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* ─── TSP BUTTON ROW ──────────────────────────────────────── */
.action-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.action-row .btn { flex: 1; min-width: 80px; }

/* ─── CONTEXT HINT ────────────────────────────────────────── */
.hint {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  padding: 6px 0;
  font-style: italic;
}

/* ─── GEOCODE SUGGESTIONS ──────────────────────────────────── */
#suggestions {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  max-height: 140px;
  overflow-y: auto;
  margin-top: -4px;
  margin-bottom: 6px;
  display: none;
}
.suggestion-item {
  padding: 7px 10px;
  cursor: pointer;
  font-size: 11px;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: var(--border); }

/* ROUTE COLOR LINE */
.route-car  { stroke: #3d7fff; }
.route-walk { stroke: #00c9a7; }
</style>
</head>
<body>

<div id="app">

  <!-- ═══ SIDEBAR ══════════════════════════════════════════ -->
  <div id="sidebar">

    <div id="sidebar-header">
      <div class="logo">Geo<span>matica</span></div>
      <div class="tagline">tracciamento itinerari multi-tappa</div>
    </div>

    <!-- MEZZO DI TRASPORTO -->
    <div class="section">
      <div class="section-title">Mezzo</div>
      <div class="transport-row">
        <button class="t-btn active" id="btn-car" onclick="setTransport('car')">
          🚗 Auto
        </button>
        <button class="t-btn" id="btn-foot" onclick="setTransport('foot')">
          🚶 Piedi
        </button>
      </div>
    </div>

    <!-- AGGIUNGI TAPPA VIA INDIRIZZO -->
    <div class="section">
      <div class="section-title">Aggiungi tappa</div>
      <div class="input-row">
        <input type="text" id="address-input" placeholder="Via Roma 1, Milano…" autocomplete="off"
               oninput="onAddressInput()" onkeydown="onAddressKey(event)"/>
        <button class="btn btn-primary" onclick="geocodeAndAdd()">+</button>
      </div>
      <div id="suggestions"></div>
      <div class="hint">oppure clicca sulla mappa per aggiungere</div>
    </div>

    <!-- SELEZIONA START / END -->
    <div class="section">
      <div class="section-title">Percorso</div>
      <div class="select-row">
        <div>
          <div class="select-label">🟢 Partenza</div>
          <select id="sel-start" onchange="onStartEndChange()"></select>
        </div>
        <div>
          <div class="select-label">🔵 Arrivo</div>
          <select id="sel-end" onchange="onStartEndChange()"></select>
        </div>
      </div>
    </div>

    <!-- AZIONI -->
    <div class="section">
      <div class="section-title">Azioni</div>
      <div class="action-row">
        <button class="btn btn-secondary" onclick="calcRoute()">📍 Calcola</button>
        <button class="btn btn-accent2" onclick="solveTSP()">🔀 Ottimizza TSP</button>
        <button class="btn btn-secondary" onclick="toggleElevation()">📈 Quota</button>
      </div>
    </div>

    <!-- LISTA TAPPE -->
    <div class="section-title" style="padding:10px 16px 4px; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;">
      Tappe <span id="wp-count" style="color:var(--accent); font-family:var(--font-mono)">0</span>
    </div>
    <div id="waypoints-scroll"></div>

    <!-- STATS -->
    <div id="stats-bar">
      <div class="stat">
        <div class="stat-val accent" id="stat-dist">—</div>
        <div class="stat-lbl">Distanza</div>
      </div>
      <div class="stat">
        <div class="stat-val accent2" id="stat-time">—</div>
        <div class="stat-lbl">Tempo stimato</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="stat-elev">—</div>
        <div class="stat-lbl">Quota max</div>
      </div>
    </div>

  </div><!-- /sidebar -->

  <!-- ═══ MAP ══════════════════════════════════════════════ -->
  <div id="map-container">
    <div id="map"></div>

    <div id="map-toast">Clicca sulla mappa per aggiungere una tappa</div>

    <div id="loading">
      <div class="spinner"></div>
    </div>

    <div id="offline-badge">● OFFLINE</div>

    <!-- ELEVATION CHART -->
    <div id="elevation-panel">
      <div class="elev-header">
        <div class="elev-title">Profilo Altimetrico</div>
        <button id="close-elev" onclick="closeElevation()">×</button>
      </div>
      <div id="elev-chart-wrap">
        <canvas id="elev-chart"></canvas>
      </div>
    </div>

  </div>

</div><!-- /app -->

<script>
// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let waypoints  = [];   // {id, lat, lng, label, marker}
let routeLayer = null;
let elevChart  = null;
let transport  = 'car';
let startIdx   = 0;
let endIdx     = 0;
let tspOrder   = null;
let lastRouteCoords = [];

// ── Cache helpers ──────────────────────────────────────────
const CACHE_PFX = 'geo_';
function cacheSet(key, val) {
  try { localStorage.setItem(CACHE_PFX + key, JSON.stringify(val)); } catch(_) {}
}
function cacheGet(key) {
  try {
    const v = localStorage.getItem(CACHE_PFX + key);
    return v ? JSON.parse(v) : null;
  } catch(_) { return null; }
}
function cacheKey(...parts) { return parts.join('|'); }

// ═══════════════════════════════════════════════════════════
//  MAP INIT
// ═══════════════════════════════════════════════════════════
const map = L.map('map', { zoomControl: false }).setView([41.9, 12.5], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'topright' }).addTo(map);

map.on('click', e => addWaypoint(e.latlng.lat, e.latlng.lng));

// ── Online/Offline banner ──────────────────────────────────
function updateOnline() {
  document.getElementById('offline-badge').style.display =
    navigator.onLine ? 'none' : 'block';
}
window.addEventListener('online',  updateOnline);
window.addEventListener('offline', updateOnline);
updateOnline();

// ═══════════════════════════════════════════════════════════
//  WAYPOINTS
// ═══════════════════════════════════════════════════════════
let _wpId = 0;

function addWaypoint(lat, lng, label) {
  const id = ++_wpId;
  const lbl = label || coordLabel(lat, lng);

  const marker = L.marker([lat, lng], {
    icon: makeIcon(waypoints.length, false),
    draggable: true
  }).addTo(map);

  marker.on('dragend', e => {
    const wp = waypoints.find(w => w.id === id);
    if (!wp) return;
    wp.lat = e.target.getLatLng().lat;
    wp.lng = e.target.getLatLng().lng;
    wp.label = coordLabel(wp.lat, wp.lng);
    renderWaypointList();
    updateSelects();
  });

  marker.on('click', e => {
    L.DomEvent.stop(e);
    removeWaypointById(id);
  });

  waypoints.push({ id, lat, lng, label: lbl, marker });
  refreshMarkerIcons();
  renderWaypointList();
  updateSelects();
}

function removeWaypointById(id) {
  const idx = waypoints.findIndex(w => w.id === id);
  if (idx === -1) return;
  map.removeLayer(waypoints[idx].marker);
  waypoints.splice(idx, 1);
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  lastRouteCoords = [];
  refreshMarkerIcons();
  renderWaypointList();
  updateSelects();
  resetStats();
  closeElevation();
}

function makeIcon(idx, isStart, isEnd) {
  const bg = isStart ? '#00c9a7' : isEnd ? '#3d7fff' : '#6b7db3';
  const html = `<div style="
    width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    background:${bg};border:2px solid #fff;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.5);">
    <span style="transform:rotate(45deg);font-size:10px;font-weight:700;color:#fff">${idx+1}</span>
  </div>`;
  return L.divIcon({ html, className: '', iconAnchor: [13, 26] });
}

function refreshMarkerIcons() {
  waypoints.forEach((wp, i) => {
    const isStart = i === startIdx;
    const isEnd   = i === endIdx;
    wp.marker.setIcon(makeIcon(i, isStart, isEnd));
  });
}

function coordLabel(lat, lng) {
  return `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
}

function renderWaypointList() {
  const el = document.getElementById('waypoints-scroll');
  document.getElementById('wp-count').textContent = waypoints.length;

  if (waypoints.length === 0) {
    el.innerHTML = `<div class="hint" style="margin-top:12px">Nessuna tappa. Clicca sulla mappa.</div>`;
    return;
  }

  const order = tspOrder || waypoints.map((_, i) => i);

  el.innerHTML = order.map((wi, pos) => {
    const wp = waypoints[wi];
    const isStart = wi === startIdx;
    const isEnd   = wi === endIdx;
    let cls = 'waypoint-item';
    if (isStart) cls += ' start';
    if (isEnd)   cls += ' end';
    const dotCls = isStart ? 'wp-index start-dot' : isEnd ? 'wp-index end-dot' : 'wp-index';
    return `
      <div class="${cls}" title="Clicca per rimuovere">
        <div class="${dotCls}">${pos+1}</div>
        <div class="wp-label">${wp.label}</div>
        <button class="btn btn-danger" onclick="removeWaypointById(${wp.id})" title="Rimuovi">✕</button>
      </div>`;
  }).join('');
}

function updateSelects() {
  const ss = document.getElementById('sel-start');
  const se = document.getElementById('sel-end');
  const opts = waypoints.map((wp, i) =>
    `<option value="${i}">${i+1}. ${wp.label.substring(0,28)}</option>`
  ).join('');
  ss.innerHTML = opts;
  se.innerHTML = opts;
  startIdx = Math.min(startIdx, Math.max(0, waypoints.length - 1));
  endIdx   = Math.min(endIdx,   Math.max(0, waypoints.length - 1));
  ss.value = startIdx;
  se.value = endIdx;
  refreshMarkerIcons();
}

function onStartEndChange() {
  startIdx = parseInt(document.getElementById('sel-start').value) || 0;
  endIdx   = parseInt(document.getElementById('sel-end').value) || 0;
  tspOrder = null;
  refreshMarkerIcons();
  renderWaypointList();
}

// ═══════════════════════════════════════════════════════════
//  TRANSPORT
// ═══════════════════════════════════════════════════════════
function setTransport(mode) {
  transport = mode;
  document.getElementById('btn-car').classList.toggle('active', mode === 'car');
  document.getElementById('btn-foot').classList.toggle('active', mode === 'foot');
  if (routeLayer) calcRoute();
}

// ═══════════════════════════════════════════════════════════
//  ROUTING (OSRM public demo — no key needed)
// ═══════════════════════════════════════════════════════════
const OSRM_PROFILE = () => transport === 'car' ? 'driving' : 'walking';
const OSRM_BASE    = 'https://router.project-osrm.org/route/v1';

async function calcRoute() {
  if (waypoints.length < 2) { alert('Aggiungi almeno 2 tappe.'); return; }

  showLoading(true);
  try {
    const order = tspOrder || buildDefaultOrder();
    const coords = order.map(i => waypoints[i]);
    const coordStr = coords.map(w => `${w.lng},${w.lat}`).join(';');
    const profile  = OSRM_PROFILE();
    const url = `${OSRM_BASE}/${profile}/${coordStr}?overview=full&geometries=geojson&annotations=false`;

    const ck = cacheKey('route', profile, coordStr);
    let data = cacheGet(ck);

    if (!data) {
      if (!navigator.onLine) { showLoading(false); alert('Offline: nessuna rotta in cache per questo percorso.'); return; }
      const res = await fetch(url);
      data = await res.json();
      cacheSet(ck, data);
    }

    if (data.code !== 'Ok') { showLoading(false); alert('Routing error: ' + data.message); return; }

    const route = data.routes[0];
    const geom  = route.geometry;

    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.geoJSON(geom, {
      style: { color: transport === 'car' ? '#3d7fff' : '#00c9a7', weight: 4, opacity: .85 }
    }).addTo(map);

    lastRouteCoords = geom.coordinates.map(c => [c[1], c[0]]);

    const distKm = (route.distance / 1000).toFixed(1);
    const timeSec = route.duration;
    document.getElementById('stat-dist').textContent = distKm + ' km';
    document.getElementById('stat-time').textContent = formatDuration(timeSec);

  } catch(e) {
    alert('Errore calcolo rotta: ' + e.message);
  }
  showLoading(false);
}

function buildDefaultOrder() {
  const n = waypoints.length;
  if (n <= 2) return waypoints.map((_, i) => i);
  const middle = [...Array(n).keys()].filter(i => i !== startIdx && i !== endIdx);
  return [startIdx, ...middle, endIdx];
}

function formatDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m} min`;
}

function resetStats() {
  document.getElementById('stat-dist').textContent = '—';
  document.getElementById('stat-time').textContent = '—';
  document.getElementById('stat-elev').textContent = '—';
}

// ═══════════════════════════════════════════════════════════
//  TSP SOLVER  (Nearest-Neighbor + 2-opt)
// ═══════════════════════════════════════════════════════════
function haversine(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const aa = Math.sin(dLat/2)**2 +
             Math.cos(a.lat * Math.PI/180) * Math.cos(b.lat * Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(aa), Math.sqrt(1-aa));
}

function buildDistMatrix(pts) {
  return pts.map((a, i) => pts.map((b, j) => i === j ? 0 : haversine(a, b)));
}

function nearestNeighbor(dist, start, end) {
  const n = dist.length;
  const visited = new Array(n).fill(false);
  visited[start] = true;
  const tour = [start];
  let curr = start;

  while (tour.length < n - 1) {
    let best = Infinity, nextNode = -1;
    for (let j = 0; j < n; j++) {
      if (!visited[j] && j !== end && dist[curr][j] < best) {
        best = dist[curr][j]; nextNode = j;
      }
    }
    if (nextNode === -1) break;
    visited[nextNode] = true;
    tour.push(nextNode);
    curr = nextNode;
  }
  tour.push(end);
  return tour;
}

function tourLen(tour, dist) {
  return tour.reduce((s, c, i) => s + (i < tour.length-1 ? dist[c][tour[i+1]] : 0), 0);
}

function twoOpt(tour, dist, maxIter = 200) {
  let improved = true, iter = 0;
  while (improved && iter++ < maxIter) {
    improved = false;
    for (let i = 1; i < tour.length - 2; i++) {
      for (let j = i + 1; j < tour.length - 1; j++) {
        const before = dist[tour[i-1]][tour[i]] + dist[tour[j]][tour[j+1]];
        const after  = dist[tour[i-1]][tour[j]] + dist[tour[i]][tour[j+1]];
        if (after < before - 1e-10) {
          tour.splice(i, j - i + 1, ...tour.slice(i, j + 1).reverse());
          improved = true;
        }
      }
    }
  }
  return tour;
}

function solveTSP() {
  if (waypoints.length < 3) { alert('Servono almeno 3 tappe per il TSP.'); return; }

  const n = waypoints.length;
  const dist = buildDistMatrix(waypoints);
  let tour = nearestNeighbor(dist, startIdx, endIdx);
  tour = twoOpt(tour, dist);

  tspOrder = tour;
  renderWaypointList();
  refreshMarkerIcons();
  calcRoute();
}

// ═══════════════════════════════════════════════════════════
//  ELEVATION  (Open-Elevation — open source)
// ═══════════════════════════════════════════════════════════
async function fetchElevation(coords) {
  // sample up to 100 points along the route
  const step = Math.max(1, Math.floor(coords.length / 100));
  const samples = coords.filter((_, i) => i % step === 0);

  const ck = cacheKey('elev', samples.map(c => c.join(',')).join('|'));
  const cached = cacheGet(ck);
  if (cached) return cached;

  if (!navigator.onLine) return null;

  const locations = samples.map(c => ({ latitude: c[0], longitude: c[1] }));
  try {
    const res = await fetch('https://api.open-elevation.com/api/v1/lookup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ locations })
    });
    const data = await res.json();
    const elevs = data.results.map(r => r.elevation);
    cacheSet(ck, elevs);
    return elevs;
  } catch(_) { return null; }
}

async function toggleElevation() {
  const panel = document.getElementById('elevation-panel');
  if (panel.classList.contains('visible')) { closeElevation(); return; }
  if (lastRouteCoords.length < 2) { alert('Calcola prima un percorso.'); return; }

  showLoading(true);
  const elevs = await fetchElevation(lastRouteCoords);
  showLoading(false);

  if (!elevs) { alert('Impossibile recuperare dati altimetrici (offline?).'); return; }

  const maxElev = Math.max(...elevs);
  document.getElementById('stat-elev').textContent = maxElev.toFixed(0) + ' m';

  panel.classList.add('visible');
  drawElevChart(elevs);
}

function closeElevation() {
  document.getElementById('elevation-panel').classList.remove('visible');
  if (elevChart) { elevChart.destroy(); elevChart = null; }
}

function drawElevChart(elevs) {
  if (elevChart) elevChart.destroy();
  const ctx = document.getElementById('elev-chart').getContext('2d');
  const labels = elevs.map((_, i) => i);

  elevChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: elevs,
        borderColor: '#3d7fff',
        backgroundColor: 'rgba(61,127,255,.15)',
        borderWidth: 1.5,
        pointRadius: 0,
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => `${ctx.parsed.y.toFixed(0)} m` }
      }},
      scales: {
        x: { display: false },
        y: {
          ticks: { color: '#7a8aaa', font: { size: 10 }, callback: v => v + 'm' },
          grid: { color: 'rgba(255,255,255,.05)' }
        }
      }
    }
  });
}

// ═══════════════════════════════════════════════════════════
//  GEOCODING  (Nominatim — no key)
// ═══════════════════════════════════════════════════════════
let _geoTimer = null;
let _suggestList = [];

function onAddressInput() {
  clearTimeout(_geoTimer);
  const q = document.getElementById('address-input').value.trim();
  if (q.length < 4) { hideSuggestions(); return; }
  _geoTimer = setTimeout(() => fetchSuggestions(q), 500);
}

function onAddressKey(e) {
  if (e.key === 'Enter') { geocodeAndAdd(); }
}

async function fetchSuggestions(q) {
  const ck = cacheKey('nom', q);
  let results = cacheGet(ck);

  if (!results) {
    if (!navigator.onLine) return;
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=5&addressdetails=0`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'it' } });
      results = await res.json();
      cacheSet(ck, results);
    } catch(_) { return; }
  }

  _suggestList = results;
  showSuggestions(results);
}

function showSuggestions(results) {
  const el = document.getElementById('suggestions');
  if (!results.length) { el.style.display = 'none'; return; }
  el.innerHTML = results.map((r, i) =>
    `<div class="suggestion-item" onclick="pickSuggestion(${i})">${r.display_name}</div>`
  ).join('');
  el.style.display = 'block';
}

function hideSuggestions() {
  document.getElementById('suggestions').style.display = 'none';
}

function pickSuggestion(i) {
  const r = _suggestList[i];
  document.getElementById('address-input').value = '';
  hideSuggestions();
  addWaypoint(parseFloat(r.lat), parseFloat(r.lon), r.display_name.split(',').slice(0,2).join(',').trim());
  map.setView([parseFloat(r.lat), parseFloat(r.lon)], 14);
}

async function geocodeAndAdd() {
  const q = document.getElementById('address-input').value.trim();
  if (!q) return;
  hideSuggestions();

  const ck = cacheKey('nom', q);
  let results = cacheGet(ck);

  if (!results) {
    if (!navigator.onLine) { alert('Offline: ricerca per indirizzo non disponibile.'); return; }
    showLoading(true);
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'it' } });
      results = await res.json();
      cacheSet(ck, results);
    } catch(e) { showLoading(false); alert('Errore geocoding: ' + e.message); return; }
    showLoading(false);
  }

  if (!results.length) { alert('Indirizzo non trovato.'); return; }
  const r = results[0];
  document.getElementById('address-input').value = '';
  addWaypoint(parseFloat(r.lat), parseFloat(r.lon), r.display_name.split(',').slice(0,2).join(',').trim());
  map.setView([parseFloat(r.lat), parseFloat(r.lon)], 14);
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function showLoading(v) {
  document.getElementById('loading').classList.toggle('visible', v);
}

// Hide toast after 4s
setTimeout(() => {
  document.getElementById('map-toast').style.opacity = '0';
}, 4000);
</script>
