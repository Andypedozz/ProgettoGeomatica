<!doctype html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
        />
        <meta name="theme-color" content="#16260f" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <title>OpenTravel · percorsi ottimali</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet/dist/leaflet.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="offlineBanner" class="offline-banner">📡 Nessuna connessione a Internet — alcune funzioni potrebbero non essere disponibili</div>
        <div class="header">
            <h1>
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6" />
                        <path d="M15.5 8.5L13 13L8.5 15.5L11 11L15.5 8.5Z" fill="currentColor" />
                        <circle cx="12" cy="12" r="1.4" fill="currentColor" />
                    </svg>
                </span>
                OpenTravel
            </h1>
            <div class="header-actions">
                <button class="toggle-panel-btn" onclick="app.toggleSidebar()" title="Mostra/nascondi pannello">
                    <span>📋</span> <span>Pannello</span>
                </button>
                <button class="theme-toggle" onclick="app.toggleTheme()">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText">Dark</span>
                </button>
            </div>
        </div>

        <div class="main-layout">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-content">
                    <div class="controls-grid">
                        <div class="addr-group input-group">
                            <label>📍 Indirizzo</label>
                            <input id="addr" placeholder="Via, città..." />
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="primary" onclick="app.addByAddress()">➕ Aggiungi</button>
                        <button class="primary" onclick="app.calculate()">🔄 Calcola</button>
                    </div>

                    <button class="danger" onclick="app.reset()">🗑️ Reset tutto</button>

                    <div class="stops-list">
                        <div class="stops-header">
                            <label>📍 Tappe</label>
                            <span class="stops-count" id="stopCount">0</span>
                        </div>
                        <div class="stops-items" id="list"></div>
                    </div>

                    <div id="results"></div>
                </div>
            </div>

            <div class="map-container">
                <div id="map"></div>

                <div id="elevationProfile" class="elevation-profile">
                    <div class="elevation-header">
                        <span class="elevation-title">
                            📈 Profilo altimetrico
                            <span class="resize-handle" id="elevResizeHandle" title="Trascina per ridimensionare (trascina in alto per ingrandire, in basso per ridurre)"></span>
                        </span>
                        <span class="elevation-stats" id="elevationStats">—</span>
                    </div>
                    <div class="elevation-canvas-wrap" id="elevationCanvasWrap">
                        <canvas id="elevationCanvas"></canvas>
                    </div>
                    <div class="elevation-labels">
                        <span id="elevMin">—</span>
                        <span id="elevMax">—</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <span>Calcolo percorso...</span>
            </div>
        </div>

        <div id="toastContainer" class="toast-container" aria-live="polite"></div>

        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <script src="app.js"></script>
    </body>
</html>
