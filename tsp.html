<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSP Optimized Pro</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #f5f5f5;
    }

    header {
      background: #111827;
      color: white;
      padding: 12px;
    }

    .container {
      display: flex;
      height: calc(100vh - 60px);
    }

    .sidebar {
      width: 360px;
      background: white;
      padding: 12px;
      overflow: auto;
      border-right: 1px solid #ddd;
    }

    #map {
      flex: 1;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
    }

    button {
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .stop {
      padding: 6px;
      background: #f3f4f6;
      margin: 5px 0;
      border-radius: 6px;
    }

    .marker div {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .start div {
      background: #16a34a;
    }

    .end div {
      background: #dc2626;
    }

    #loading {
      display: none;
      padding: 8px;
      background: #fbbf24;
      margin: 6px 0;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <header>
    <h3>TSP Optimized Pro (OSRM Table + 2-opt)</h3>
  </header>

  <div class="container">

    <div class="sidebar">

      <input id="addr" placeholder="Inserisci indirizzo">
      <button class="primary" onclick="app.addByAddress()">Aggiungi</button>

      <select id="mode">
        <option value="driving">Auto</option>
        <option value="walking">Piedi</option>
      </select>

      <select id="algo">
        <option value="nn">Nearest Neighbor (multi-start)</option>
        <option value="twoopt">2-Opt (migliore qualità)</option>
      </select>

      <button class="primary" onclick="app.calculate()">Calcola percorso</button>
      <button class="danger" onclick="app.reset()">Reset</button>

      <div id="loading">Calcolo in corso...</div>

      <h4>Tappe</h4>
      <div id="list"></div>

      <div id="result"></div>

    </div>

    <div id="map"></div>

  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    class RoutePlanner {
      constructor() {
        this.map = L.map('map').setView([43.7, 12.6], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: 'OSM'
        }).addTo(this.map);

        this.points = [];
        this.markers = [];
        this.matrix = null;
        this.cache = new Map();
        this.lastNominatim = 0;

        this.routeLayer = null;

        this.map.on('click', e => {
          this.addPoint(e.latlng.lat, e.latlng.lng);
        });
      }

      setLoading(v) {
        document.getElementById("loading").style.display = v ? "block" : "none";
      }

      uid() {
        return Math.random().toString(36).slice(2);
      }

      addPoint(lat, lng) {
        const p = { id: this.uid(), lat, lng };
        this.points.push(p);

        const m = L.marker([lat, lng]).addTo(this.map);
        m.on('click', () => this.removePoint(p.id));

        this.markers.push({ id: p.id, marker: m });
        this.updateList();
      }

      removePoint(id) {
        this.points = this.points.filter(p => p.id !== id);

        const m = this.markers.find(x => x.id === id);
        if (m) this.map.removeLayer(m.marker);

        this.markers = this.markers.filter(x => x.id !== id);

        this.updateList();
        this.clearRoute();
      }

      updateList() {
        document.getElementById("list").innerHTML =
          this.points.map((p, i) => `<div class="stop">Tappa ${i + 1}</div>`).join('');
      }

      async geocode(addr) {
        const now = Date.now();
        if (now - this.lastNominatim < 1100) {
          await new Promise(r => setTimeout(r, 1100));
        }
        this.lastNominatim = Date.now();

        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}`;
        const r = await fetch(url, { headers: { "User-Agent": "TSP-App" } });
        const d = await r.json();
        if (!d.length) return null;

        return { lat: +d[0].lat, lng: +d[0].lon };
      }

      async addByAddress() {
        const addr = document.getElementById("addr").value;
        if (!addr) return;

        const g = await this.geocode(addr);
        if (!g) return alert("Non trovato");

        this.addPoint(g.lat, g.lng);
        this.map.setView([g.lat, g.lng], 13);
      }

      async buildMatrix(mode) {
        const key = JSON.stringify(this.points.map(p => [p.lat, p.lng, mode]));
        if (this.cache.has(key)) {
          this.matrix = this.cache.get(key);
          return;
        }

        const coords = this.points.map(p => `${p.lng},${p.lat}`).join(';');
        const url = `https://router.project-osrm.org/table/v1/${mode}/${coords}?annotations=duration`;

        const r = await fetch(url);
        const d = await r.json();

        this.matrix = d.durations;
        this.cache.set(key, this.matrix);
      }

      cost(path) {
        let s = 0;
        for (let i = 1; i < path.length; i++) {
          s += this.matrix[path[i - 1]][path[i]];
        }
        return s;
      }

      nearestNeighbor(startIndex) {
        const n = this.points.length;
        const visited = new Set();
        let path = [startIndex];
        visited.add(startIndex);

        while (path.length < n) {
          let last = path[path.length - 1];
          let best = -1, bestVal = Infinity;

          for (let i = 0; i < n; i++) {
            if (visited.has(i)) continue;
            if (this.matrix[last][i] < bestVal) {
              bestVal = this.matrix[last][i];
              best = i;
            }
          }

          visited.add(best);
          path.push(best);
        }

        return path;
      }

      multiStartNN() {
        let bestPath = null;
        let bestCost = Infinity;

        for (let i = 0; i < this.points.length; i++) {
          const p = this.nearestNeighbor(i);
          const c = this.cost(p);
          if (c < bestCost) {
            bestCost = c;
            bestPath = p;
          }
        }

        return bestPath;
      }

      twoOpt(path) {
        let improved = true;

        while (improved) {
          improved = false;

          for (let i = 1; i < path.length - 2; i++) {
            for (let j = i + 1; j < path.length; j++) {
              const newPath = path.slice(0, i)
                .concat(path.slice(i, j + 1).reverse())
                .concat(path.slice(j + 1));

              if (this.cost(newPath) < this.cost(path)) {
                path = newPath;
                improved = true;
              }
            }
          }
        }

        return path;
      }

      async calculate() {
        if (this.points.length < 2) return alert("Min 2 tappe");

        this.setLoading(true);
        this.clearRoute();

        const mode = document.getElementById("mode").value;
        const algo = document.getElementById("algo").value;

        await this.buildMatrix(mode);

        let path;

        if (algo === "nn") {
          path = this.multiStartNN();
        } else {
          path = this.twoOpt(this.multiStartNN());
        }

        await this.draw(path, mode);
        this.rebuildMarkers(path);

        this.setLoading(false);
      }

      async draw(path, mode) {
        const coords = path.map(i =>
          `${this.points[i].lng},${this.points[i].lat}`
        ).join(';');

        const url =
          `https://router.project-osrm.org/route/v1/${mode}/${coords}?overview=full&geometries=geojson`;

        const r = await fetch(url);
        const d = await r.json();

        if (this.routeLayer) this.map.removeLayer(this.routeLayer);

        this.routeLayer = L.geoJSON(d.routes[0].geometry, {
          style: { color: "blue", weight: 5 }
        }).addTo(this.map);

        this.map.fitBounds(this.routeLayer.getBounds());
      }

      rebuildMarkers(path) {
        this.markers.forEach(m => this.map.removeLayer(m.marker));
        this.markers = [];

        path.forEach((i, idx) => {
          const p = this.points[i];

          const icon = L.divIcon({
            className: "marker " + (idx === 0 ? "start" : idx === path.length - 1 ? "end" : ""),
            html: `<div>${idx + 1}</div>`
          });

          const m = L.marker([p.lat, p.lng], { icon }).addTo(this.map);

          this.markers.push({ id: p.id, marker: m });
        });
      }

      clearRoute() {
        if (this.routeLayer) this.map.removeLayer(this.routeLayer);
      }

      reset() {
        this.points = [];
        this.markers.forEach(m => this.map.removeLayer(m.marker));
        this.markers = [];
        this.clearRoute();
        this.updateList();
      }
    }

    const app = new RoutePlanner();
  </script>

</body>

</html>
